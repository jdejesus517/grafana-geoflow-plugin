version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: 'weekly'
    # Wait 5 days before updating to help circumvent supply chain attacks
    cooldown:
      default-days: 5
      # Exclude plugin-e2e to prevent false positives with canary e2e tests
      exclude:
        - '@grafana/plugin-e2e'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      # Grafana provides these packages at runtime, so their version sets the APIs the plugin
      # compiles against. Keep them on the minimum supported Grafana (grafanaDependency in
      # src/plugin.json, currently 13.2.x) and take patch updates only; raise them together with
      # grafanaDependency.
      - dependency-name: '@grafana/data'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@grafana/i18n'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@grafana/runtime'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@grafana/schema'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@grafana/ui'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # ESLint 10 is not supported by eslint-plugin-react yet (peer dependency conflict, see #8).
      # Remove once the scaffold's ESLint config supports it.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
    groups:
      unit-test:
        patterns:
          - '@testing-library/*'
          - 'jest*'
          - '@types/jest'
      eslint:
        patterns:
          - '@grafana/eslint-config'
          - 'eslint*'
          - '@typescript-eslint/*'
          - '@stylistic/*'
      grafana:
        patterns:
          - '@grafana/*'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
    open-pull-requests-limit: 5
