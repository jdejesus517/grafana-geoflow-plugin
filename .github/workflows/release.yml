# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
      # For the build provenance attestation.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v2.0.0
        with:
          # Keep in sync with .nvmrc (this action takes a version, not a file; its default is 20).
          node-version: '26'
          # Signs the plugin. The token is a Grafana Cloud access policy token with the plugins:write scope
          # (https://grafana.com/developers/plugin-tools/publish-a-plugin/sign-a-plugin#generate-an-access-policy-token).
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          # Creates a signed build provenance attestation, so the catalog can verify where the zip was built.
          attestation: true
